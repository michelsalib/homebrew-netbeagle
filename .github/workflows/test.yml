name: test

on:
  push:
    branches: [main]
  pull_request:

# read-only: CI never writes to the repository
permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the formula from this checkout, installed as a tap would be, then its own test block
      - name: brew install and test
        run: |
          [ -x /home/linuxbrew/.linuxbrew/bin/brew ] && eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew tap michelsalib/netbeagle "$GITHUB_WORKSPACE"
          brew install michelsalib/netbeagle/netbeagle
          brew test michelsalib/netbeagle/netbeagle
          netbeagle list
      - name: Homebrew logs
        if: failure()
        run: cat ~/.cache/Homebrew/Logs/netbeagle/* ~/Library/Logs/Homebrew/netbeagle/* 2>/dev/null || true
